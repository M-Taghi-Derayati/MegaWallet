// Compose compiler stability configuration (PERF-02).
//
// Marks the listed types as STABLE for the Compose compiler WITHOUT annotating them with
// androidx @Immutable/@Stable. Domain models must stay framework-free (clean architecture — no
// androidx/Compose deps in :domain), so they are declared stable here instead of in source.
//
// Why it helps: Kotlin 2.4 has Compose *strong skipping* on by default, so composables are already
// skippable — but for an UNSTABLE parameter Compose can only skip when the SAME instance is passed
// (reference equality). Our ViewModels emit fresh-but-equal instances from StateFlow on every
// refresh (a new AssetItem / TransactionRecord / list). Declaring these models stable lets Compose
// compare by value (equals) and skip when the content is unchanged, cutting recomposition on
// balance/price/tab churn.
//
// SAFE because every entry is effectively immutable: the domain models are `val` data classes that
// are recreated via copy(), never mutated in place; BigInteger/BigDecimal are immutable value
// types. Do NOT add a type here that mutates its fields in place — Compose would then skip a real
// change and render stale UI.
//
// Wired via app/build.gradle.kts:
//   composeCompiler { stabilityConfigurationFiles.add(rootProject.layout.projectDirectory.file("compose_stability.conf")) }
//
// NOTE: this does NOT make kotlin.collections.List stable (a List may be a mutable impl). For list
// PARAMETERS that churn, migrate to kotlinx.collections.immutable.ImmutableList (optional follow-up).

// All domain types — immutable val data classes / enums / sealed states rendered by Compose.
// Covers every :domain subpackage (model, security, capability, gassless, …); e.g. it also marks
// com.mtd.domain.security.SecuritySnapshot stable, which .model.** alone missed. Interfaces/use
// cases here are never Compose params, so listing them is harmless.
com.mtd.domain.**

// Immutable numeric value types embedded in those models
java.math.BigInteger
java.math.BigDecimal
