navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
#//////////////////////////////////////////////////#

#///////////////// Core ////////////////////////#


web3-core={group="org.web3j",name="core",version.ref="webCore"}
web3-crypto={group="org.web3j",name="crypto",version.ref="webCoreUtils"}
web3-utils={group="org.web3j",name="utils",version.ref="webCoreUtils"}
bitcoinj={group="org.bitcoinj",name="bitcoinj-core",version.ref="bitcoinj-core"}
bitcoin-kmp={group="fr.acinq.bitcoin",name="bitcoin-kmp",version.ref="bitcoin-kmp"}
