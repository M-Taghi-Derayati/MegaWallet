security-crypto={group="androidx.security",name="security-crypto",version.ref="security-crypto"}

#//////////////////////////////////////////////////#
dagger-hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "dagger-hilt" }
dagger-hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "dagger-hilt" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "navigation-hilt" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
# TASK-25 — Firebase Crashlytics (versions come from the BOM).
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

# Wave 4 — multidex removed (dead)
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
gson-converter = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
scalars-converter = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }
framgnet  ={module="androidx.fragment:fragment-ktx",version.ref="fragment"}
viewModel  ={module="androidx.lifecycle:lifecycle-viewmodel-ktx",version.ref="viewmodel"}
recyclerview  ={module="androidx.recyclerview:recyclerview",version.ref="recyclerview"}
qrgen  ={module="com.github.kenglxn.qrgen:android",version.ref="qrgen"}
flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }
coil-compose = { module = "io.coil-kt:coil-compose-base", version.ref = "coil" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
navFragment = { module="androidx.navigation:navigation-fragment-ktx",version.ref="navigation" }
navUi  = { module="androidx.navigation:navigation-ui-ktx",version.ref="navigation" }
navUi-hitl  = { module="androidx.hilt:hilt-navigation-fragment",version.ref="navigation-hilt" }
utilcodex  = { module = "com.blankj:utilcodex", version.ref = "utilcodex" }
slidetoact  = { module = "com.ncorti:slidetoact", version.ref = "slidetoact" }
socket     = { module = "io.socket:socket.io-client",version.ref="socket"}

#///////////////////DATA///////////////

google-credentials = { module = "androidx.credentials:credentials", version.ref = "play-credentials" }
google-credentials-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "play-credentials" }
google-identity = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "play-identity" }
google-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "google-coroutines" }

google-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "google-auth2" }
google-auth2 = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "google-auth" }
google-api-client = { module = "com.google.api-client:google-api-client-android", version.ref = "google-api-client" }
google-api-services-drive = { module = "com.google.apis:google-api-services-drive", version.ref = "google-api-service" }




#///////////////////TEST///////////////#
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
coroutines-test={ group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
mockk={ group = "io.mockk", name = "mockk", version.ref = "mockk" }
hilt-test={ group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt-testing" }

#///////////////////////////////////////#

[bundles]
coil = ["coil", "coil-svg","coil-compose"]
google-auth=["google-credentials","google-coroutines","google-credentials-auth","google-api-client","google-auth","google-auth2","google-api-services-drive","google-identity"]
web3=["web3-core","web3-crypto","web3-utils"]
coroutines = ["coroutines", "coroutines-android"]
okhttp = ["okhttp", "okhttp-logging"]
gson = ["gson", "gson-converter","scalars-converter"]
navigation=["navFragment","navUi","navUi-hitl"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
android-ksp = { id = "com.google.devtools.ksp", version.ref = "android-ksp" }
android-hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger-hilt" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "firebase_plugin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics-plugin" }
